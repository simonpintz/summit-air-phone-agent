services:
  - type: web
    name: summit-air-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: ./bookings.db
      - key: VAPI_TOOL_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
